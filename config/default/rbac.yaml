apiVersion: v1
kind: ServiceAccount
metadata:
  name: infra-smoketest-controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infra-smoketest-probe
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infra-smoketest-controller
rules:
  - apiGroups: [smoketest.turnkey.engineering]
    resources: [smoketests]
    verbs: [get, list, watch]
  - apiGroups: [smoketest.turnkey.engineering]
    resources: [smoketestruns]
    verbs: [get, list, watch, update, patch, delete]
  - apiGroups: [smoketest.turnkey.engineering]
    resources: [smoketestruns/status, smoketestruns/finalizers]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims, configmaps]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [infra-smoketest-probe, infra-smoketest-aws]
    verbs: [get]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infra-smoketest-controller
subjects:
  - kind: ServiceAccount
    name: infra-smoketest-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infra-smoketest-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infra-smoketest-controller
rules:
  - apiGroups: [""]
    resources: [nodes, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [csinodes, volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    resourceNames: [ebs-gp3]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infra-smoketest-controller
subjects:
  - kind: ServiceAccount
    name: infra-smoketest-controller
    namespace: infra-smoketest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infra-smoketest-controller
