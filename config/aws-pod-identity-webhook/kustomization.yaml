apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra-smoketest
resources:
  - serviceaccount.yaml
configMapGenerator:
  - name: infra-smoketest-aws-config
    literals:
      # Shared by the controller, all probes, and the ServiceAccount below.
      - AWS_ACCOUNT_ID=361645878370
      - AWS_IDENTITY_ROLE_NAME=infra-smoketest-aws
replacements:
  - source:
      kind: ConfigMap
      name: infra-smoketest-aws-config
      fieldPath: data.AWS_ACCOUNT_ID
    targets:
      - select:
          kind: ServiceAccount
          name: infra-smoketest-aws
        fieldPaths:
          - metadata.annotations.[eks.amazonaws.com/role-arn]
        options:
          delimiter: ':'
          index: 4
  - source:
      kind: ConfigMap
      name: infra-smoketest-aws-config
      fieldPath: data.AWS_IDENTITY_ROLE_NAME
    targets:
      - select:
          kind: ServiceAccount
          name: infra-smoketest-aws
        fieldPaths:
          - metadata.annotations.[eks.amazonaws.com/role-arn]
        options:
          delimiter: '/'
          index: 1
